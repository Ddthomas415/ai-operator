name: tests

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest

      - name: Install package
        run: |
          pip install -e .

      - name: Run pytest
        run: |
          python -m pytest -q

      - name: Run eval suite
        run: |
          python -m evals.run_all

      - name: Verify clean install script
        run: |
          chmod +x scripts/verify_clean_install.sh
          ./scripts/verify_clean_install.sh

      - name: Build package
        run: |
          python -m build
